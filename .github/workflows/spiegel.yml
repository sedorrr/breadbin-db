# Stufe 3a: den gebauten Stand zusätzlich auf den eigenen Webspace legen (per FTPS).
# Läuft nur, wenn die Secrets gesetzt sind: SPIEGEL_HOST, SPIEGEL_USER, SPIEGEL_PASSWORD, SPIEGEL_DIR
# (Ordner nach der FTP-Anmeldung). Variable SPIEGEL_URL = öffentliche Adresse der Datei; der Lauf prüft sie.
# Dazu app/version.json (neueste Breadbin-Fassung, die App sieht beim Start nach) und die Übersichtsseite
# (index.html + spiele.json + images/: Statistik und Suche, tools/seite.py).
# Stage 3a: also put the built data on our own web space (FTPS), only if the secrets are set.
name: Spiegel auf Webspace
on:
  workflow_run:
    workflows: ["Stand veröffentlichen"]
    types: [completed]
  workflow_dispatch:
    inputs:
      liste:
        description: "Nur Ordner auf dem Webspace auflisten (Fehlersuche)"
        type: boolean
        default: false
# Läufe nacheinander (Stand und „Beiträge übernehmen“ können beide einen Lauf anstoßen)
concurrency:
  group: spiegel
  cancel-in-progress: false
jobs:
  spiegel:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SPIEGEL_HOST }}
      USER: ${{ secrets.SPIEGEL_USER }}
      PASS: ${{ secrets.SPIEGEL_PASSWORD }}
      DIR: ${{ secrets.SPIEGEL_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets vorhanden?
        id: da
        run: echo "ok=$([ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$PASS" ] && [ -n "$DIR" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.da.outputs.ok == '1' && inputs.liste
        name: Ordner auflisten
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          # kein pwd: lftp zeigt dort die URL samt Passwort, URL-kodiert und damit von GitHub nicht maskiert
          lftp -u "$USER","$PASS" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; cls -1 -F; cls -1 -F $DIR; bye" "$HOST" || true
      - if: steps.da.outputs.ok == '1' && !inputs.liste
        run: python3 tools/pruefen.py && python3 tools/paket.py && python3 tools/seite.py
      - if: steps.da.outputs.ok == '1' && !inputs.liste
        name: Hochladen (FTPS)
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          python3 - <<'PY' > dist/stand.json
          import json, time, zipfile
          z = zipfile.ZipFile("dist/breadbin-db.zip")
          m = json.loads(z.read("breadbin-share.json"))
          print(json.dumps({"games": m["games"], "created": m["created"], "file": "breadbin-db.zip"}))
          PY
          lftp -u "$USER","$PASS" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ssl:verify-certificate yes; mkdir -p -f $DIR; cd $DIR; put dist/breadbin-db.zip -o breadbin-db.zip.neu; mv breadbin-db.zip.neu breadbin-db.zip; put dist/stand.json; put app/version.json -o version.json; put dist/seite/spiele.json -o spiele.json; put dist/seite/index.html -o index.html; put tools/seite/version.php -o version.php; put tools/seite/dl.php -o dl.php; put tools/seite/htaccess -o .htaccess; mirror -R --only-newer --no-perms images images; bye" "$HOST"
      - if: steps.da.outputs.ok == '1' && !inputs.liste && vars.SPIEGEL_URL != ''
        name: Abrufbar?
        run: |
          curl -fsS -o /tmp/pruef.zip "${{ vars.SPIEGEL_URL }}"
          cmp /tmp/pruef.zip dist/breadbin-db.zip && echo "Spiegel stimmt mit dem Stand überein."
      - if: steps.da.outputs.ok != '1'
        run: echo "Keine Spiegel-Secrets gesetzt – übersprungen."
